# ScamLens — full stack.
#   docker compose up --build
#   API + docs : http://localhost:8000/docs
#   Product    : http://localhost:8000   (the PWA, served by the API container)
#
# Optional dev-only overlay (hot reload for the frontend) is commented at the end.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: scamlens:latest
    container_name: scamlens-api
    ports:
      - "8000:8000"
    environment:
      # Gemini is primary, Groq is the automatic fallback when Gemini is rate-limited.
      # Leave both empty to run the deterministic local agent.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      AGENT_MAX_STEPS: "6"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_PATH: /data/scamlens.db
      ML_ARTIFACTS_DIR: /app/ml/artifacts
      URL_PROBE_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "30"
      FRONTEND_ORIGINS: http://localhost:8000,http://localhost:5173
      # If you expose the API on a public hostname, list it explicitly instead of "*".
    volumes:
      - scamlens-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Frontend dev server (optional; the production build is already baked into the
  # api image). Uncomment to iterate on the UI with hot reload:
  #
  # web:
  #   image: node:20-alpine
  #   working_dir: /web
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  #   environment:
  #     VITE_API_PROXY: http://api:8000
  #   ports: ["5173:5173"]
  #   volumes:
  #     - ./frontend:/web
  #   depends_on: [api]

volumes:
  scamlens-data:
