services:
  - type: web
    name: scamlens-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ENVIRONMENT
        value: production
      - key: DB_PATH
        value: /data/scamlens.db
      - key: ML_ARTIFACTS_DIR
        value: /app/ml/artifacts
      - key: GROQ_MODEL
      value: openai/gpt-oss-120b
